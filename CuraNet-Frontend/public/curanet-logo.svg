<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="curaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Premium rounded squircle container -->
  <rect width="64" height="64" rx="18" fill="url(#curaBg)" />
  
  <!-- Subtle inner border for crisp contrast in browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Centered HeartPulse brand emblem -->
  <g transform="translate(10, 10) scale(1.833)" filter="url(#glow)">
    <!-- Heart shape -->
    <path 
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" 
      fill="rgba(255, 255, 255, 0.15)" 
      stroke="#ffffff" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Dynamic mint ECG pulse line -->
    <path 
      d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" 
      fill="none" 
      stroke="#5eead4" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
